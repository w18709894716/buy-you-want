# Per-service configuration for byw-order (Nacos data-id: byw-order.yml, group: DEFAULT_GROUP)
# Loaded automatically by Spring Cloud Alibaba (spring.cloud.nacos.config.file-extension=yml).
# Repo mirror of this file: docs/deploy/nacos/services/byw-order.yml
#
# KEEP ASCII-ONLY: non-ASCII content makes the nacos client parse the whole config to EMPTY silently.
# Secrets are jasypt ENC(...) values; the master key comes from env JASYPT_ENCRYPTOR_PASSWORD.

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/byw_order?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ENC(wtqk+Xb7N/VJATrcW+w1ZDjJJDrEeFqV6S+eo5LUS0wnihpH088DJtQ3VLOzxp+P)
    driver-class-name: com.mysql.cj.jdbc.Driver
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: byw-order-producer
    send-message-timeout: 3000
byw:
  order:
    # Post-commit compensation task (t_compensation_task) scan settings.
    # Tasks are always created; this only controls how fast the scheduler retries them.
    compensation-scan-interval-ms: ${BYW_ORDER_COMPENSATION_SCAN_INTERVAL_MS:60000}
    compensation-batch-size: ${BYW_ORDER_COMPENSATION_BATCH_SIZE:100}
    # After this many attempts a task moves to status=2 (manual).
    compensation-max-retry: ${BYW_ORDER_COMPENSATION_MAX_RETRY:7}
    # A task stuck in status=3 longer than this is assumed crashed and requeued.
    compensation-stale-minutes: ${BYW_ORDER_COMPENSATION_STALE_MINUTES:10}
