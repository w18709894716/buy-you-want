# Per-service configuration for byw-file (Nacos data-id: byw-file.yml, group: DEFAULT_GROUP)
# Loaded automatically by Spring Cloud Alibaba (spring.cloud.nacos.config.file-extension=yml).
# Repo mirror of this file: docs/deploy/nacos/services/byw-file.yml
#
# KEEP ASCII-ONLY: non-ASCII content makes the nacos client parse the whole config to EMPTY silently.
# Secrets are jasypt ENC(...) values; the master key comes from env JASYPT_ENCRYPTOR_PASSWORD.

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET:byw-files}
  public-url: ${MINIO_PUBLIC_URL:}
