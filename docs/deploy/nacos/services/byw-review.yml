    username: ${MYSQL_USER:root}
    password: ENC(wtqk+Xb7N/VJATrcW+w1ZDjJJDrEeFqV6S+eo5LUS0wnihpH088DJtQ3VLOzxp+P)
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/byw_review}
