# Per-service configuration for byw-im (Nacos data-id: byw-im.yml, group: DEFAULT_GROUP)
# Loaded automatically by Spring Cloud Alibaba (spring.cloud.nacos.config.file-extension=yml).
# Repo mirror of this file: docs/deploy/nacos/services/byw-im.yml
#
# KEEP ASCII-ONLY: non-ASCII content makes the nacos client parse the whole config to EMPTY silently.
# Secrets are jasypt ENC(...) values; the master key comes from env JASYPT_ENCRYPTOR_PASSWORD.

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/byw_im?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ENC(wtqk+Xb7N/VJATrcW+w1ZDjJJDrEeFqV6S+eo5LUS0wnihpH088DJtQ3VLOzxp+P)
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/byw_im}
byw:
  im:
    message-retention-days: ${BYW_IM_MESSAGE_RETENTION_DAYS:180}
rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: byw-im-producer
    send-message-timeout: 3000
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 86400
  is-concurrent: true
  is-share: false
  is-read-cookie: false
  is-read-header: true
  token-style: uuid
