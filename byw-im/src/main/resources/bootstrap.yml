# 本文件只保留"启动自举 + 日志"两类配置：
#   - server.port / spring.application.name / nacos 连接与 shared-configs：读 Nacos 之前就要用到，不能上移
#   - logging：日志系统早于远程配置初始化，放 Nacos 不生效（实测）
# 其余服务私有配置（datasource / rocketmq / jetcache / minio / mongodb / elasticsearch / 网关路由…）
# 已上移到 Nacos 的 byw-<service>.yml（数据源密码是 jasypt 密文，主密钥走环境变量 JASYPT_ENCRYPTOR_PASSWORD）

server:
  port: 8095
spring:
  application:
    name: byw-im
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
      config:
        server-addr: ${NACOS_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:}
        file-extension: yml
        shared-configs:
          - data-id: byw-common.yml
            group: DEFAULT_GROUP
            refresh: true
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] [%thread]
      %logger{36} - %msg%n"
