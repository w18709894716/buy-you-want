# RocketMQ broker 配置（docker compose 用）
# 容器内运行时让 broker 自动探测容器 IP 即可：同一 compose 网络内的服务都能解析到它。
# 若要让"宿主机上直接跑的 java 进程"连进来，需要把 brokerIP1 设成宿主机可达的地址，
# 否则会出现 connect to <容器IP>:10911 failed（本项目已在真实环境踩过这个坑）。
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 演示环境允许自动建 topic（生产应关闭并显式创建）
autoCreateTopicEnable = true
