# =============================================================================
# 应用编排（16 个服务，镜像由 deploy/Dockerfile 按 MODULE 参数各自构建）
#
# 推荐用法（两步，便于只重启应用而不动中间件）：
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.app.yml up -d --build
#
# 也可以一次起全（同一条命令里合并两个文件）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.app.yml up -d --build
#
# 注意：
# - 服务之间通过 Nacos 服务发现调用，这里不写 depends_on，先起中间件再起应用即可；
# - 只有网关（8080）对外发布；业务服务端口一律绑到 127.0.0.1，容器间仍走 compose 网络。
#   直连业务端口会绕过网关的身份头签名，暴露给宿主网卡等于把伪造身份的入口开在公网上；
# - 基础设施的连接参数通过环境变量注入，与各服务 bootstrap.yml 里的 ${MYSQL_HOST} 等占位符对应；
# - 演示用堆参数 256m/512m，生产请在 compose 或 K8s 里设内存限额并改用 MaxRAMPercentage。
# =============================================================================
name: byw-app

x-common-env: &common-env
  NACOS_ADDR: nacos:8848
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ROCKETMQ_NAMESRV: rocketmq-namesrv:9876
  TZ: Asia/Shanghai
  JAVA_OPTS: "-Xms256m -Xmx512m"
  # jasypt 主密钥：配置里的 ENC(...) 靠它解密。缺失时服务启动即失败（fail-closed），
  # 所以这里用 ${VAR:?} 强制要求从 shell / .env 注入，而不是留个空值。
  JASYPT_ENCRYPTOR_PASSWORD: ${JASYPT_ENCRYPTOR_PASSWORD:?JASYPT_ENCRYPTOR_PASSWORD is required}
  # 中间件地址必须用 compose 服务名：容器里的 localhost 是容器自己，连不到别的基础设施。
  # 这些占位符在 docs/deploy/nacos/services/*.yml 里都有 localhost 默认值，不覆盖就会连错。
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: byw-files
  # 浏览器侧直接访问的图片地址，走宿主机映射端口（生产改成外网域名或 CDN）
  MINIO_PUBLIC_URL: http://localhost:9000
  ES_URIS: elasticsearch:9200
  # 生产（HTTPS）必须把下面两项配上，否则 Cookie 不会被浏览器回传 / 渠道回调会被拒：
  #   BYW_AUTH_COOKIE_SECURE: "true"
  #   BYW_PAY_CALLBACK_SECRET: <与渠道约定的密钥>

services:
  byw-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: byw-gateway
    image: byw/byw-gateway:local
    container_name: byw-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *common-env

  byw-auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: byw-auth
    image: byw/byw-auth:local
    container_name: byw-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *common-env

  byw-user:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: byw-user
    image: byw/byw-user:local
    container_name: byw-user
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      <<: *common-env

  byw-product:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MODULE: byw-product
    image: byw/byw-product:local
    container_name: byw-product
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      <<: *common-env
      ES_URIS: "elasticsearch:9200"

  byw-cart:
